<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Purchase Orders</title>
  <!-- standalone start page for local testing; on BTP the app runs inside Work Zone -->
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resource-roots='{ "p2p.purchaseorders": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"></script>
  <style>
    /* Fiori Elements pages are height:100% - the containers need a height, otherwise the app collapses to 0px (white screen) */
    html, body, body > div, #container, #container-uiarea { height: 100%; }
  </style>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component data-name="p2p.purchaseorders" data-id="container" data-settings='{ "id": "p2p.purchaseorders" }' data-handle-validation="true"></div>
</body>
</html>
